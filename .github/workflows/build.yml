name: Build BPF + Skeleton
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic
          BPF=$(ls /usr/lib/linux-tools/*/bpftool | head -1)
          sudo ln -sf "$BPF" /usr/local/bin/bpftool

      - name: Fetch libbpf headers
        run: |
          git clone --depth 1 https://github.com/libbpf/libbpf.git /tmp/libbpf
          mkdir -p bpf
          cp /tmp/libbpf/src/*.h bpf/

      - name: Compile BPF
        run: clang -g -O2 -target bpf -D__TARGET_ARCH_arm64 -I. -c fermata_core.bpf.c -o fermata_core.bpf.o

      - name: Generate skeleton
        run: bpftool gen skeleton fermata_core.bpf.o > fermata_core.skel.h

      - name: Show output
        run: ls -lh fermata_core.bpf.o fermata_core.skel.h

      - uses: actions/upload-artifact@v4
        with:
          name: bpf-output
          path: |
            fermata_core.bpf.o
            fermata_core.skel.h
